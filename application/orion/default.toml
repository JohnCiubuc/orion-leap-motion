# Orion Renewal configuration — edit by hand or in the app (changes apply live).
# Location: ~/.config/orion-renewal/config.toml

[general]
source = "leap"          # leap | demo
engage_required = false  # require the "engage" gesture (open palm toward screen) before each gesture
engage_window = 2.0      # seconds a gesture may follow "engage"
ir_fps = 30              # raw IR stream rate in the dashboard
port = 0                 # local UI port (0 = random free port)
auto_wake = 10           # restart the controller after this many seconds without frames (0 = off)
preferred_hand = "left"  # side a new hand gets until the tracker is sure: left | right | none

# Gesture overlay: a translucent card in a corner of the focused monitor (layer-shell, click-through).
[overlay]
enabled = true
opacity = 0.85           # 0.2 … 1
seconds = 1.6            # how long each card stays
corner = "top-right"     # top-right | top-left | bottom-right | bottom-left
margin = 16              # px from the screen edges (bars like Waybar are already accounted for)
show_unbound = false     # also show gestures that have no binding
precision_ring = true    # ring around the cursor while the desktop pointer is in precision mode

# Per-gesture tuning: [gestures.<name>] enabled = false / <param> = value
[gestures.swipe]
distance = 110

[gestures.pointer]
track = "palm"           # what steers the air mouse: palm | palm_stable | knuckles | index | middle | pinch

# Desktop mouse: the controller's view is mapped onto the whole desktop (all monitors).
# The view is view_width mm wide (centred over the device) and view_top mm tall above the device.
# The inner `coverage` of it reaches the left, right and top screen edges, so the cursor is in
# the corner before the hand leaves view; the bottom screen edge is at `bottom` mm above the device.
[gestures.desktop_pointer]
track = "palm"
coverage = 0.85
view_width = 251
view_top = 351
bottom = 150
responsive = 0.16
precision = 0.2          # cursor travel per mm of hand movement once the hand settles (1 = off)
dwell = 0.09             # s the hand must stay slow before precision starts
enter_speed = 40         # mm/s: slower than this starts the dwell
exit_speed = 82          # mm/s: faster than this leaves precision
radius = 9               # mm from where precision started at which movement is 1:1 again
edge = 27                # mm from the view's limits where precision is off, so the edges always reach
rest = 0.1               # mm of tremor ignored
glide = 0.0694             # s for the cursor to glide back onto the hand after precision

# Profiles activate when the focused window's class matches `match` (regex).
# Bindings with profile = "<name>" override "default" bindings for the same gesture.
[profiles.zen]
match = "(?i)^zen"

[profiles.spotify]
match = "(?i)spotify"

# Modes are groups of bindings toggled at runtime (tray, or the orion.mode action).
# exclusive = only that mode's bindings (and orion.* actions) fire while it is on, and no other
#             mode can be on at the same time.
# on_enter / on_exit = actions run when the mode turns on / off, e.g.
#   on_enter = [{ action = "shell", args = { cmd = "kitty" } },
#               { action = "hypr.global", args = { shortcut = "kando:example-menu" } }]
# follow_app = window-class regex: the mode turns itself off when that app's last window closes
#              (or if no such window appears within follow_grace seconds, default 15).
[modes.air_mouse]
exclusive = true

# Desktop mouse: the cursor goes where the hand is (absolute), instead of moving with it like air mouse.
[modes.desktop_mouse]
exclusive = true

# ── Default profile ──────────────────────────────────────────────────────────
# hypr.dispatch takes classic syntax ("workspace e+1"), translated automatically when Hyprland
# runs a Lua config, or Lua directly: cmd = 'hl.dsp.focus({ workspace = "e+1" })'.
[[bindings]]
gesture = "swipe.left"
action = "hypr.dispatch"
args = { cmd = "workspace e-1" }

[[bindings]]
gesture = "swipe.right"
action = "hypr.dispatch"
args = { cmd = "workspace e+1" }

[[bindings]]
gesture = "thumbs_up"
action = "media"
args = { op = "PlayPause" }

[[bindings]]
gesture = "thumbs_down"
action = "audio.mute"

[[bindings]]
gesture = "rotate"
action = "audio.dial"

[[bindings]]
gesture = "palm_flip.up"
action = "hypr.dispatch"
args = { cmd = "togglespecialworkspace magic" }

[[bindings]]
gesture = "path.circle"
action = "media"
args = { op = "Next" }

[[bindings]]
gesture = "path.z"
action = "media"
args = { op = "Previous" }

[[bindings]]
gesture = "path.square"
action = "hypr.dispatch"
args = { cmd = "fullscreen 1" }

# Pinch and lift / push away to scroll up, lower / pull in to scroll down: one notch per 20 mm moved.
[[bindings]]
gesture = "pinch_joy.up"
action = "input.scroll"
args = { amount = 1 }

[[bindings]]
gesture = "pinch_joy.down"
action = "input.scroll"
args = { amount = -1 }

# Same with a fist for volume: 2 % per step.
[[bindings]]
gesture = "grab_joy.up"
action = "audio.volume"
args = { step = 2 }

[[bindings]]
gesture = "grab_joy.down"
action = "audio.volume"
args = { step = -2 }

[[bindings]]
gesture = "ok"
action = "orion.mode"
args = { mode = "air_mouse", state = "on" }

# ── Zen browser ──────────────────────────────────────────────────────────────
[[bindings]]
gesture = "swipe.left"
action = "browser"
args = { op = "prev_tab" }
profile = "zen"

[[bindings]]
gesture = "swipe.right"
action = "browser"
args = { op = "next_tab" }
profile = "zen"

[[bindings]]
gesture = "palm_flip.down"
action = "browser"
args = { op = "back" }
profile = "zen"

[[bindings]]
gesture = "zoom"
action = "browser.zoom"
profile = "zen"

# ── Spotify ──────────────────────────────────────────────────────────────────
[[bindings]]
gesture = "swipe.left"
action = "media"
args = { op = "Previous", player = "spotify" }
profile = "spotify"

[[bindings]]
gesture = "swipe.right"
action = "media"
args = { op = "Next", player = "spotify" }
profile = "spotify"

# ── Air mouse mode ───────────────────────────────────────────────────────────
[[bindings]]
gesture = "pointer"
action = "input.pointer"
args = { gain = 4.0 }
mode = "air_mouse"

[[bindings]]
gesture = "pinch"
action = "input.button"
args = { button = "left" }
mode = "air_mouse"

[[bindings]]
gesture = "peace"
action = "input.click"
args = { button = "right" }
mode = "air_mouse"

[[bindings]]
gesture = "fist"
action = "orion.mode"
args = { mode = "air_mouse", state = "off" }
mode = "air_mouse"

# ── Desktop mouse mode ───────────────────────────────────────────────────────
# Turn it on from the tray or Profiles → Modes, or bind a gesture to orion.mode desktop_mouse.
[[bindings]]
gesture = "desktop_pointer"
action = "input.desktop"
args = { display = "" }  # a Hyprland monitor name (e.g. "DP-3") keeps the cursor on that display
mode = "desktop_mouse"

[[bindings]]
gesture = "pinch"
action = "input.button"
args = { button = "left" }
mode = "desktop_mouse"

[[bindings]]
gesture = "peace"
action = "input.click"
args = { button = "right" }
mode = "desktop_mouse"

[[bindings]]
gesture = "fist"
action = "orion.mode"
args = { mode = "desktop_mouse", state = "off" }
mode = "desktop_mouse"
