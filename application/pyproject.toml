[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-renewal"
version = "0.1.0"
description = "Gesture control hub for the Leap Motion Controller on Hyprland"
requires-python = ">=3.12"
# The LeapC bindings (`leap`, `leapc_cffi`) are built by ../scripts/setup-python.sh, not PyPI.
dependencies = ["numpy", "aiohttp", "PySide6>=6.8", "evdev", "jeepney", "tomlkit"]

[project.optional-dependencies]
dev = ["pytest"]
webcam = ["mediapipe"]

[project.scripts]
orion-renewal = "orion.app:main"

[tool.setuptools.packages.find]
include = ["orion*"]

[tool.setuptools.package-data]
orion = ["default.toml", "assets/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
